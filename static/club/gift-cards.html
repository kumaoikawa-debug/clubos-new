<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClubOS NEW · 礼品卡</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261113b">
  <link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261111z">
  <link rel="stylesheet" href="/static/club/club-glass.css?v=20261112b">
  <style>
    body{margin:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#16362b}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    h1{font-size:18px;margin:0 0 4px}
    .tip{font-size:12px;color:#8aa39a;margin:0 0 12px;line-height:1.6}
    .card{background:#fff;border:1px solid #e7edea;border-radius:14px;padding:14px;margin-bottom:12px}
    .card h3{font-size:14px;margin:0 0 10px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .stat{flex:1;min-width:105px;background:#fff;border:1px solid #e7edea;border-radius:12px;padding:12px}
    .stat .k{font-size:11px;color:#8aa39a}
    .stat .v{font-size:19px;font-weight:700;margin-top:3px}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
    .row label{font-size:12px;color:#5d7a6e;min-width:92px}
    .row input,.row select{padding:6px 8px;border:1px solid #d7e2dd;border-radius:8px;font-size:13px;flex:1;min-width:110px}
    .row input[type=checkbox]{flex:0;min-width:0;width:16px;height:16px}
    .row input.sm,.row select.sm{min-width:80px;max-width:140px;flex:0 1 120px}
    .btn{padding:7px 14px;border-radius:9px;border:1px solid #0a7d52;background:#0a7d52;color:#fff;font-size:13px;cursor:pointer}
    .btn.ghost{background:#fff;color:#0a7d52}
    .btn.sm{padding:4px 9px;font-size:12px}
    .btn.danger{border-color:#c0392b;background:#fff;color:#c0392b}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .empty{color:#8aa39a;text-align:center;padding:16px;font-size:13px}
    .item{border:1px solid #e7edea;border-radius:11px;padding:10px;margin-bottom:9px}
    .item__head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .item__title{font-weight:600;font-size:13px}
    .muted{font-size:12px;color:#8aa39a}
    .code{font-family:ui-monospace,Menlo,monospace;background:#eef3f0;padding:2px 7px;border-radius:6px;font-size:12px}
    .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef3f0;color:#5d7a6e}
    .badge.on{background:#e3f6ec;color:#0a7d52}
    .badge.warn{background:#fdf3e2;color:#a06a10}
    .badge.off{background:#f6e7e6;color:#b03a2e}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
    th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #f0f4f2}
    th{color:#8aa39a;font-weight:500}
    .scroll{max-height:280px;overflow:auto;margin-top:8px}
    .out{font-size:12px;color:#0a7d52}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>礼品卡</h1>
    <p class="tip">按批次发行固定面额卡密 → 会员兑换进「礼品卡余额」→ 订单完成后按单核销。金额按「分」记账，与会员储值、积分是三套独立账户，互不写入。核销需显式调用，不改动下单与实收；报价页只展示可抵扣额度（appliedToPayable=false）。</p>

    <div class="stats" id="stats"></div>

    <div class="card">
      <h3>礼品卡配置</h3>
      <div class="row"><label>启用礼品卡</label><input type="checkbox" id="cfgEnabled"></div>
      <div class="row"><label>每人兑换上限</label><input type="number" class="sm" id="cfgLimit" min="0" max="100" step="1"> <span class="muted">张，0 = 不限；达到上限后该会员不能再兑换</span></div>
      <div class="row"><label>C 端说明文案</label><input id="cfgNotice" placeholder="例如：礼品卡可用于活动报名，不找零、不提现" maxlength="120"></div>
      <div class="row" style="justify-content:flex-end"><span class="muted" id="hubHint"></span><button class="btn sm" id="saveCfg">保存配置</button></div>
    </div>

    <div class="card">
      <h3>发卡批次</h3>
      <div class="row">
        <input class="sm" id="bName" placeholder="批次名称">
        <input type="number" class="sm" id="bFace" placeholder="面额(元)" min="0.01" step="0.01">
        <input type="number" class="sm" id="bCount" placeholder="发卡数" min="1" max="500" step="1">
        <input class="sm" id="bFrom" placeholder="生效日 YYYY-MM-DD">
        <input class="sm" id="bUntil" placeholder="到期日 YYYY-MM-DD">
        <button class="btn sm" id="createBatch">新建并发行</button>
      </div>
      <div id="batches"></div>
    </div>

    <div class="card">
      <h3>卡密</h3>
      <div class="row">
        <select class="sm" id="filterBatch"><option value="">全部批次</option></select>
        <select class="sm" id="filterStatus">
          <option value="">全部状态</option>
          <option value="ACTIVE">未兑换</option>
          <option value="REDEEMED">已兑换</option>
          <option value="FROZEN">已冻结</option>
          <option value="VOID">已作废</option>
        </select>
        <input class="sm" id="filterCode" placeholder="精确卡密">
        <button class="btn sm ghost" id="refreshCards">查询</button>
        <button class="btn sm ghost" id="exportCards">导出 CSV</button>
      </div>
      <div class="scroll" id="cards"></div>
    </div>

    <div class="card">
      <h3>兑换 / 核销 / 冲回</h3>
      <div class="row">
        <input class="sm" id="redeemCode" placeholder="卡密">
        <input type="number" class="sm" id="redeemUid" placeholder="会员 user_id">
        <button class="btn sm" id="redeemBtn">代客兑换</button>
        <span class="out" id="redeemOut"></span>
      </div>
      <div class="row">
        <input type="number" class="sm" id="useUid" placeholder="会员 user_id">
        <input type="number" class="sm" id="useAmount" placeholder="核销金额(元)" min="0.01" step="0.01">
        <select class="sm" id="useType">
          <option value="registration">活动报名</option>
          <option value="gear_order">装备订单</option>
          <option value="custom">其它</option>
        </select>
        <input class="sm" id="useOrder" placeholder="订单号">
        <button class="btn sm" id="useBtn">核销</button>
        <button class="btn sm ghost" id="reverseBtn">冲回</button>
        <span class="out" id="useOut"></span>
      </div>
      <div class="muted">冲回使用上一行的会员 / 订单类型 / 订单号，把该笔核销退回余额；同一订单只能冲一次。</div>
    </div>

    <div class="card">
      <h3>余额账户</h3>
      <div class="scroll" id="accounts"></div>
    </div>

    <div class="card">
      <h3>流水</h3>
      <div class="row">
        <input type="number" class="sm" id="ledgerUid" placeholder="按会员 user_id 筛选">
        <button class="btn sm ghost" id="refreshLedger">查询</button>
      </div>
      <div class="scroll" id="ledger"></div>
    </div>
  </div>

  <script src="/static/shared.js?v=20261113b"></script>
  <script src="/static/club/gift-cards.js?v=20261113g"></script>
</body>
</html>
