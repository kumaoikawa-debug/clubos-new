<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClubOS NEW · 门店/基地</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261113a">
  <link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261114a">
  <link rel="stylesheet" href="/static/club/club-glass.css?v=20261112b">
  <style>
    body{margin:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#16362b}
    .wrap{max-width:820px;margin:0 auto;padding:18px}
    h1{font-size:18px;margin:0 0 4px}
    .tip{font-size:12px;color:#8aa39a;margin:0 0 12px}
    .card{background:#fff;border:1px solid #e7edea;border-radius:14px;padding:14px;margin-bottom:12px}
    .store{border:1px solid #e7edea;border-radius:12px;padding:12px;margin-bottom:10px}
    .store__head{display:flex;align-items:center;justify-content:space-between}
    .store__name{font-weight:700;font-size:15px}
    .def{font-size:11px;padding:2px 8px;border-radius:20px;background:#e3f6ec;color:#0a7d52;margin-left:6px}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
    .row label{font-size:12px;color:#5d7a6e;min-width:72px}
    .row input,.row select,.row textarea{padding:6px 8px;border:1px solid #d7e2dd;border-radius:8px;font-size:13px;flex:1;min-width:140px}
    .btn{padding:7px 14px;border-radius:9px;border:1px solid #0a7d52;background:#0a7d52;color:#fff;font-size:13px;cursor:pointer}
    .btn.ghost{background:#fff;color:#0a7d52}
    .btn.sm{padding:4px 9px;font-size:12px}
    .btn.danger{border-color:#c0392b;background:#fff;color:#c0392b}
    .empty{color:#8aa39a;text-align:center;padding:16px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>门店 / 基地 / 分队</h1>
    <p class="tip">多据点经营的地基：总部、分部、活动基地、分队都可登记为门店。营销活动、商品、权益的"门店维度"将来统一挂靠到这里。第一个门店自动成为默认门店。</p>
    <div class="card">
      <h3 style="margin:0 0 10px">门店列表</h3>
      <div id="list"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="addBtn">＋ 新增门店</button>
      </div>
    </div>
  </div>

  <script src="/static/shared.js?v=20261113a"></script>
  <script src="/static/club/stores.js?v=20261113a"></script>
</body>
</html>
