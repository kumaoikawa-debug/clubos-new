<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClubOS NEW · 会员储值</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261113b">
  <link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261114a">
  <link rel="stylesheet" href="/static/club/club-glass.css?v=20261112b">
  <style>
    body{margin:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#16362b}
    .wrap{max-width:900px;margin:0 auto;padding:18px}
    h1{font-size:18px;margin:0 0 4px}
    .tip{font-size:12px;color:#8aa39a;margin:0 0 12px;line-height:1.6}
    .card{background:#fff;border:1px solid #e7edea;border-radius:14px;padding:14px;margin-bottom:12px}
    .card h3{font-size:14px;margin:0 0 10px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .stat{flex:1;min-width:110px;background:#fff;border:1px solid #e7edea;border-radius:12px;padding:12px}
    .stat .k{font-size:11px;color:#8aa39a}
    .stat .v{font-size:19px;font-weight:700;margin-top:3px}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
    .row label{font-size:12px;color:#5d7a6e;min-width:96px}
    .row input,.row select{padding:6px 8px;border:1px solid #d7e2dd;border-radius:8px;font-size:13px;flex:1;min-width:120px}
    .row input[type=checkbox]{flex:0;min-width:0;width:16px;height:16px}
    .row input.sm{min-width:80px;max-width:110px;flex:0 1 100px}
    .btn{padding:7px 14px;border-radius:9px;border:1px solid #0a7d52;background:#0a7d52;color:#fff;font-size:13px;cursor:pointer}
    .btn.ghost{background:#fff;color:#0a7d52}
    .btn.sm{padding:4px 9px;font-size:12px}
    .btn.danger{border-color:#c0392b;background:#fff;color:#c0392b}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .empty{color:#8aa39a;text-align:center;padding:16px;font-size:13px}
    .item{border:1px solid #e7edea;border-radius:11px;padding:10px;margin-bottom:9px}
    .item__head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .item__title{font-weight:600;font-size:13px}
    .muted{font-size:12px;color:#8aa39a}
    .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef3f0;color:#5d7a6e}
    .badge.on{background:#e3f6ec;color:#0a7d52}
    .badge.warn{background:#fdf3e2;color:#a06a10}
    .badge.off{background:#f6e7e6;color:#b03a2e}
    .rule{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
    .rule input{padding:5px 7px;border:1px solid #d7e2dd;border-radius:8px;font-size:12px;width:96px}
    .rule input.wide{width:150px}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
    th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #f0f4f2}
    th{color:#8aa39a;font-weight:500}
    .ledger{max-height:230px;overflow:auto;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>会员储值</h1>
    <p class="tip">会员先充值（可设「充 X 送 Y」档位），报名或商城支付时用余额抵扣。金额按「分」记账，流水可审计；后台确认到账后余额才会增加。未开启时不影响任何既有下单链路。</p>

    <div class="stats" id="stats"></div>

    <div class="card">
      <h3>储值配置</h3>
      <div class="row"><label>启用储值</label><input type="checkbox" id="cfgEnabled"></div>
      <div class="row"><label>允许活动报名抵扣</label><input type="checkbox" id="cfgAllowActivity"></div>
      <div class="row"><label>单笔最多抵扣</label><input type="number" class="sm" id="cfgRatio" min="0" max="100" step="1"> <span class="muted">%（100 = 可全额使用）</span></div>
      <div class="row"><label>最低充值金额</label><input type="number" class="sm" id="cfgMinRecharge" min="0" step="1"> <span class="muted">元</span></div>
      <div class="row" style="margin-top:10px"><label>充赠档位</label><span class="muted">充值金额达到门槛时，按「门槛最高」的档位赠送</span></div>
      <div id="rules"></div>
      <div class="row" style="justify-content:flex-end;margin-top:8px">
        <button class="btn sm ghost" id="addRule">＋ 添加档位</button>
        <button class="btn sm" id="saveCfg">保存配置</button>
      </div>
    </div>

    <div class="card">
      <h3>充值单</h3>
      <div class="row">
        <label>会员 ID</label><input type="number" class="sm" id="rcUserId" placeholder="如 1">
        <label style="min-width:auto">金额(元)</label><input type="number" class="sm" id="rcAmount" placeholder="如 500">
        <button class="btn sm" id="createRc">开充值单</button>
      </div>
      <div id="recharges"></div>
    </div>

    <div class="card">
      <h3>储值账户</h3>
      <div class="row">
        <label>搜索</label><input id="acctQ" placeholder="姓名 / 手机号 / 会员 ID">
        <button class="btn sm ghost" id="acctSearch">查询</button>
      </div>
      <div id="accounts"></div>
    </div>
  </div>

  <script src="/static/shared.js?v=20261113b"></script>
  <script src="/static/club/stored-value.js?v=20261113b"></script>
</body>
</html>
