<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClubOS NEW · 页面装修</title>
  <link rel="stylesheet" href="/static/shared.css?v=20261113a">
  <link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261111z">
  <link rel="stylesheet" href="/static/club/club-glass.css?v=20261112b">
  <style>
    body{margin:0;background:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#16362b}
    .wrap{max-width:880px;margin:0 auto;padding:18px}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .top h1{font-size:18px;margin:0}
    .top select{padding:6px 10px;border-radius:8px;border:1px solid #d7e2dd}
    .card{background:#fff;border:1px solid #e7edea;border-radius:14px;padding:14px;margin-bottom:12px}
    .card h3{margin:0 0 10px;font-size:15px}
    .comp{border:1px solid #e7edea;border-radius:12px;padding:12px;margin-bottom:10px;background:#fafcfb}
    .comp__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .comp__type{font-weight:700}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
    .row label{font-size:12px;color:#5d7a6e;min-width:84px}
    .row input,.row select,.row textarea{padding:6px 8px;border:1px solid #d7e2dd;border-radius:8px;font-size:13px;flex:1;min-width:140px}
    .row textarea{min-height:54px}
    .btn{padding:7px 14px;border-radius:9px;border:1px solid #0a7d52;background:#0a7d52;color:#fff;font-size:13px;cursor:pointer}
    .btn.ghost{background:#fff;color:#0a7d52}
    .btn.sm{padding:4px 9px;font-size:12px}
    .btn.danger{border-color:#c0392b;background:#fff;color:#c0392b}
    .mini-img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid #e0e8e4}
    .empty{color:#8aa39a;text-align:center;padding:18px}
    .status{font-size:12px;padding:3px 9px;border-radius:20px;background:#eee}
    .status.pub{background:#e3f6ec;color:#0a7d52}
    .status.draft{background:#f3f0e6;color:#92751f}
    .tip{font-size:12px;color:#8aa39a;margin:2px 0 10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>页面装修</h1>
      <select id="pageKey">
        <option value="club_home">俱乐部主页 (club_home)</option>
        <option value="activity_detail">活动详情页 (activity_detail)</option>
      </select>
      <span id="statusPill" class="status draft">未配置</span>
    </div>
    <div class="tip">组件化装修：俱乐部可自由拼装「轮播图 / 导航宫格 / 活动列表 / 营销入口 / 公告栏 / 自由容器」。保存为草稿，发布后 C 端立即生效；未发布时 C 端回落默认页面。</div>

    <div class="card">
      <h3>组件列表</h3>
      <div class="row"><label>布局标题</label><input id="titleInput" placeholder="如：冬季主页（仅后台标记用）"></div>
      <div id="comps"></div>
      <div class="row" style="margin-top:10px">
        <select id="addType">
          <option value="carousel">轮播图</option>
          <option value="nav_grid">导航宫格</option>
          <option value="activity_list">活动列表</option>
          <option value="marketing_entry">营销入口</option>
          <option value="notice">公告栏</option>
          <option value="free_container">自由容器</option>
        </select>
        <button class="btn sm" id="addBtn">＋ 添加组件</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost" id="saveBtn">保存草稿</button>
        <button class="btn ghost" id="publishBtn">发布</button>
        <button class="btn ghost" id="unpublishBtn">转为草稿</button>
        <button class="btn danger" id="deleteBtn">删除布局</button>
      </div>
    </div>
  </div>

  <script src="/static/shared.js?v=20261113a"></script>
  <script src="/static/club/page-decorator.js?v=20261113a"></script>
</body>
</html>
