<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClubOS 安全登录</title><style>body{background:#eff3ef;color:#21392c;min-height:90vh;display:grid;place-items:center;font:16px system-ui}main{padding:32px;width:min(90vw,390px);background:white;border-radius:20px;box-shadow:0 12px 42px #15351d1a}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #b9cabe;border-radius:8px}button{width:100%;padding:13px;background:#213f31;border:0;color:white;border-radius:8px;cursor:pointer}p{color:#66766c;font-size:13px}#msg{color:#a12e2e}</style><link rel="stylesheet" href="/static/ux/clubos-ux.css"><style>body{background:radial-gradient(circle at 10% 10%,#dfebd7,transparent 36%),#f4f6f0}main{border:1px solid #e3ebe1;box-shadow:0 25px 90px #142c2020}main h1{letter-spacing:-1px}button{border-radius:10px}input{border-radius:10px}</style></head><body><main><h1>ClubOS NEW</h1><p>安全登录 · 体验升级预览</p><form id="form"><label>账号<input id="u" autocomplete="username" required></label><label>密码<input id="p" type="password" autocomplete="current-password" required></label><button>登录</button></form><p id="msg" role="alert"></p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});if(!r.ok){document.getElementById('msg').textContent='登录失败，请检查凭据或稍后重试';return}let x=await r.json();location.href={platform:'/platform',club:'/club',member:'/web',leader:'/leader'}[x.identity.role]||'/login'});</script></body></html>
