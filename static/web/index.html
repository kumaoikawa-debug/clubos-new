<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>远拓户外</title>
<!-- 内联 SVG 图标：省掉 /favicon.ico 的 404（浏览器默认会去请求它）。
     用山形描边，和底部导航的图标同一套笔画。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121714'/%3E%3Cpath d='M3.5 23.5 12 11l4.6 7.6 3-4.8 8.9 9.7z' fill='none' stroke='%237fd0a4' stroke-width='2.1' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/shared.css?v=20261014a"><link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261014a"><link rel="stylesheet" href="/static/web/web.css?v=20261022a"><link rel="stylesheet" href="/static/ux/open-props.css?v=20261014a"><link rel="stylesheet" href="/static/ux/clubos-polish.css?v=20261014a"></head><body>

<!-- C 端骨架：5 视图（首页 / 活动 / 装备 / 户外能力 / 我的）。
     结构类 .web-shell / .web-top / .web-content / .wview / .web-nav 全部保留 ——
     experience-core.js 与 experience-consumer.js 靠 .web-nav、.web-content、#publicActivities、
     #publicProducts 定位，换掉它们等于让这两个装饰层静默失效。
     视觉全部在 /static/web/web.css（C 端专属），四端共用的 shared.css / clubos-ux.css 一个字节没动。 -->
<div class="web-shell is-home">

  <header class="web-top">
    <button class="web-top__btn" type="button" onclick="wv('wactivities')" aria-label="搜索活动"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg></button>
    <strong>远拓户外</strong>
    <!-- 购物车：只在装备页（.is-mall）或车里真有东西时出现（见 web.css .web-top__cart）。
         #cartBadge 是角标数字，renderCartBadge() 把它和父按钮的 .has 一起切显隐。 -->
    <button class="web-top__cart" type="button" onclick="openCart()" aria-label="购物车"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.3 11.4a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/><circle cx="9.5" cy="20" r="1.1"/><circle cx="17" cy="20" r="1.1"/></svg><i class="web-top__badge" id="cartBadge" hidden>0</i></button>
    <button class="web-top__btn" type="button" onclick="wv('wme')" aria-label="我的"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></svg></button>
  </header>

  <div class="web-content">

    <!-- ── 首页：满屏 hero（一屏一张大图）+ 全部活动瀑布流 ──────────────────
         .w-hero--full 的高度由 CSS 给（100svh 减底部导航），这里不再写像素；
         骨架屏跟着撑满同一高度，免得加载完照片时页面"跳一下"。
         #homeFeed 由 web-biz.js 的 loadHome() 填充：全部活动按最新上架倒序的瀑布流，
         没有封面时走兜底渐变卡。#homeFeatured/#homeGear 已删 —— 旧 web.js 的
         loadHome 对它们都有 null 守卫，删节点不会报错。 -->
    <section id="whome" class="wview">
      <div class="w-hero w-hero--full" id="homeHero"><div class="w-sk" style="padding:0;height:100%"><div class="w-sk__bar" style="height:100%;border-radius:0"></div></div></div>
      <div class="w-pad w-waterfall" id="homeFeed"></div>
    </section>

    <!-- ── 活动：分类磁贴 + 地区 chips + 全部活动瀑布流 ────────────────────
         2026-10-18 按用户要求改版：**删掉顶部「本期主推」主题卡大图轮播**（首屏那张
         占满一屏的竖版大卡），活动页直接从「活动分类」开始 —— 顾客进来第一眼要
         看到可选项，不是先看一张推广大图再往下滑。
         同时删掉「全部活动 / 共 N 场可报名」这块区块头：分类磁贴每张都标着场次，
         地区 chips 也带计数，再顶一行标题＋场次属于重复信息。
         分类磁贴（#actCats）= 带图选项：按主题挑一场，磁贴图用该主题下第一场活动的
         **真实封面**，没有就走品牌渐变兜底、不画假图；地区 chips（#activityChips）
         = 第二道筛选，按地点串里的真实地名归组。两个维度都由前端从活动的真实字段
         （标题 / 地点）推导 —— 活动表没有「类型」字段，不为这个改后端。
         #publicActivities 保留：experience-core.js 靠它定位，删掉 = 装饰层静默失效。 -->
    <section id="wactivities" class="wview" style="display:none">
      <div id="activityList">
        <!-- 这两块用 div 而非 section：外层 #wactivities 本身就是 section，
             再嵌一层会让「#wactivities 里有哪些子块」这类静态断言按第一个
             section 闭合标签切分时提前截断（tests/web_act_view_guard.py）。 -->
        <div class="w-sec w-pad w-sec--cats">
          <div class="w-cats" id="actCats"></div>
          <div class="w-chips w-chips--acts" id="activityChips"></div>
        </div>
        <div class="w-waterfall" id="publicActivities"></div>
        <div id="activityEmpty"></div>
      </div>
      <div id="publicDetail"></div>
    </section>

    <!-- ── 装备：左侧分类导轨 + 右侧主视觉/双列网格（对齐 PEAKTRACE 小程序商城版式）
         版式：搜索整宽 → 左导轨（中文 + 件数两行，选中项只在左侧出一条黑条）+ 右内容
         （主视觉横幅 → 区块头 → 双列商品网格）。整页只有一个搜索框。
         ★ 结构不能动的部分：容器类 .w-shop（web.js 的 showProductPane / showMallList 用
           `#wmall .w-shop` 切显隐）；#publicProducts 必须带 .w-grid 且子节点是 .web-card
           （experience-consumer.js 按 `#publicProducts .web-card` 数商品张数）；
           #gearSearch / #mallCats / #mallTabs / #mallHero / #mallTitle / #mallSub / #mallNote
           都是 web.js 里 renderMall* 的写入目标。 -->
    <section id="wmall" class="wview" style="display:none">
      <div class="w-shop">
        <div class="w-shop__top">
          <label class="w-field w-field--shop"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg><input id="gearSearch" type="search" placeholder="搜索装备名称或分类" aria-label="搜索装备"></label>
        </div>
        <div class="w-shop__body">
          <aside class="w-shop__side" id="mallCats"></aside>
          <div class="w-shop__main">
            <!-- 主视觉：内容由 renderMallHero() 写；没有真实封面时走品牌渐变兜底，不画假图 -->
            <div class="w-shop__hero" id="mallHero"></div>
            <div class="w-shop__head">
              <h2 class="w-shop__title" id="mallTitle">全部装备</h2>
              <div class="w-shop__en" id="mallEn"></div>
              <div class="w-shop__sub" id="mallSub">正在读取在售装备…</div>
            </div>
            <div class="w-shop__tabs" id="mallTabs"></div>
            <div class="w-grid" id="publicProducts"></div>
            <div class="w-shop__note" id="mallNote">平台统一商品、库存、发货与售后；会员等级折扣在结算时自动生效。</div>
          </div>
        </div>
      </div>
      <!-- 装备详情页：与活动详情页同一个套路 —— 列表区留在 DOM 里靠 display 切换，
           返回时不用重新拉数据。它不能放进 #publicProducts，否则会被
           experience-consumer.js 当成又一件商品数进去。 -->
      <div id="productDetail"></div>
      <!-- 确认订单页：详情 →（收货地址 + 价格明细）→ 提交订单 → 支付。
           装备是实物、平台统一发货，所以这一页必须收到一个真实地址才让提交。
           同样留在 DOM 里靠 display 切换（#gearCheckout 是 wmall 的子节点）。 -->
      <div id="gearCheckout"></div>
      <!-- 购物车页：与详情/结算同级，靠 display 切换。openCart/renderCart/paintCart 写这里。 -->
      <div id="cartView"></div>
    </section>

    <!-- ── 业务介绍：俱乐部老板可自定义的板块（后台开关 + 自定义内容）──────
         数据来自 clubs.biz_section_json（后台 PATCH 开关 + 内容）。
         关闭或没配内容时整块不渲染 —— 空壳板块比没有板块更伤信任。
         旧「户外能力」的履历/技能/装备块全部移除：那是伪造的能力值，
         后端没有 skill 表，前端不得编造能力。 -->
    <section id="wability" class="wview" style="display:none">
      <div class="w-biz" id="bizIntro"></div>
    </section>

    <!-- ── 我的：参考 PEAKTRACE 小程序「我的」版式（深色会员卡 + 积分 + 四宫格 + 商城订单五态 + 服务列表）
         所有 2 级子页面由 static/web/me.js 的 pushMe() 栈渲染到 #meStack（JS 注入到 .web-shell）。
         写入点：mePaintHome 直接写下列 id（meClubPts/meGearPts/meName/meTier/meCardNo/meGrow/meUp/meQuad/meOrders）。
         已删旧 #clubPts/#gearPts/#worders/#wmember 那套；购物车 / 旅行记录无后端支撑一并移除（按「把没用的去掉」）。 -->
    <section id="wme" class="wview" style="display:none">
      <div class="wme-hero">
        <div class="wme-hero__bg"></div>
        <div class="wme-hero__shine"></div>
        <button class="wme-card" type="button" onclick="pushMe('membercard')" aria-label="查看会员信息">
          <div class="wme-card__top">
            <div class="wme-card__id">
              <div class="wme-ava" id="meAva">远</div>
              <div class="wme-card__who">
                <div class="wme-card__name"><span id="meName">远拓会员</span><i class="wme-tier" id="meTier">普通会员</i></div>
                <div class="wme-card__no" id="meCardNo">NO. —</div>
              </div>
            </div>
            <span class="wme-card__qrtile"><canvas class="wme-card__qr" id="meQr" width="88" height="88"></canvas></span>
          </div>
          <div class="wme-card__bot">
            <div class="wme-card__grow"><b id="meGrow">0</b><em class="wme-card__unit">元</em><span>成长值</span></div>
            <div class="wme-card__up"><span id="meUp">—</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></div>
          </div>
          <!-- 升级进度：成长值到下一档门槛的比例（me.js 写 #meProg 的 width） -->
          <div class="wme-card__prog"><i id="meProg"></i></div>
        </button>
      </div>

      <div class="wme-points">
        <div class="wme-point">
          <span class="wme-point__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6v4.8l3.2 2"/></svg></span>
          <div class="wme-point__txt"><b id="meClubPts">0</b><span>可用积分</span></div>
        </div>
        <div class="wme-point">
          <span class="wme-point__ic wme-point__ic--gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 8.4h12.8l-1.1 11H6.7z"/><path d="M8.8 8.4V6.8a3.2 3.2 0 0 1 6.4 0v1.6"/></svg></span>
          <div class="wme-point__txt"><b id="meGearPts">0</b><span>装备积分</span></div>
        </div>
      </div>

      <div class="wme-quad" id="meQuad"></div>

      <div class="wme-sec">
        <div class="wme-sec__hd"><span>商城订单</span><button class="wme-sec__all" type="button" onclick="pushMe('orders','all')">查看全部<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button></div>
        <div class="wme-orders" id="meOrders"></div>
      </div>

      <div class="wme-list" id="meList">
        <button class="wme-li" type="button" onclick="pushMe('aftersale')">
          <span class="wme-li__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 10.4a7.4 7.4 0 1 1 2 6"/><path d="M4.4 5.6v4.8h4.8"/></svg></span>
          <span class="wme-li__tx">售后 / 退款</span><i class="wme-li__ar">›</i></button>
        <button class="wme-li" type="button" onclick="pushMe('service')">
          <span class="wme-li__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 5.8h13.6v10.4H9.4L5.2 19z"/><path d="M8.8 9.6h6.4M8.8 12.6h4"/></svg></span>
          <span class="wme-li__tx">联系我们</span><i class="wme-li__ar">›</i></button>
        <button class="wme-li" type="button" onclick="pushMe('about')">
          <span class="wme-li__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 11v5.2"/><path d="M12 8.2h.01"/></svg></span>
          <span class="wme-li__tx">关于远拓户外</span><i class="wme-li__ar">›</i></button>
        <button class="wme-li wme-li--out" type="button" onclick="meLogout()">
          <span class="wme-li__ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 6.6V4.8H5.2v14.4h9.2v-1.8"/><path d="M11.4 12h8.2"/><path d="m16.6 8.8 3.2 3.2-3.2 3.2"/></svg></span>
          <span class="wme-li__tx">退出登录</span><i class="wme-li__ar">›</i></button>
      </div>
      <div class="wme-foot">远拓户外 · MEMBER</div>
    </section>

  </div>

  <!-- 底部导航 5 格：首页 / 活动 / 装备 / 户外能力 / 我的。
       图标做成内联 SVG —— 旧版是 clubos-ux.css 里 :nth-child(n):before 的字符图标，
       只有 4 个，加到第 5 格会没有图标可用；字符字形在不同系统上也不可控。 -->
  <nav class="web-nav" aria-label="主要导航">
    <button class="active" data-wv="whome" onclick="wv('whome',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.4 9.4V20h13.2V9.4"/><path d="M9.6 20v-5.6h4.8V20"/></svg><span>首页</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wactivities" onclick="wv('wactivities',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5 9.5 7l4 6.6 2.4-3.9 5.6 9.8z"/></svg><span>活动</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wmall" onclick="wv('wmall',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M8.6 8V6.4a3.4 3.4 0 0 1 6.8 0V8"/></svg><span>装备</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wability" onclick="wv('wability',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4 10.8 10.8 8.4 15.6l4.8-2.4z"/></svg><span>户外能力</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wme" onclick="wv('wme',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></svg><span>我的</span><i class="w-navdot" aria-hidden="true"></i></button>
  </nav>
</div>

<script src="/static/shared.js?v=20261018e"></script>
<script src="/static/ux/clubos-cities.js?v=20261023a"></script><script src="/static/web/web.js?v=20261023a"></script>
<script src="/static/web/web-biz.js?v=20261018c"></script>
<script src="/static/web/me.js?v=20261022a"></script>

<script src="/static/ux/qr-local.js?v=20261014a"></script>

</body></html>
