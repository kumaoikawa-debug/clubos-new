<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>远拓户外</title>
<!-- 内联 SVG 图标：省掉 /favicon.ico 的 404（浏览器默认会去请求它）。
     用山形描边，和底部导航的图标同一套笔画。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121714'/%3E%3Cpath d='M3.5 23.5 12 11l4.6 7.6 3-4.8 8.9 9.7z' fill='none' stroke='%237fd0a4' stroke-width='2.1' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/shared.css?v=20261010a"><link rel="stylesheet" href="/static/ux/clubos-ux.css?v=20261010a"><link rel="stylesheet" href="/static/web/web.css?v=20261010a"><link rel="stylesheet" href="/static/ux/open-props.css?v=20261010a"><link rel="stylesheet" href="/static/ux/clubos-polish.css?v=20261010a"></head><body>

<!-- C 端骨架：5 视图（首页 / 活动 / 装备 / 户外能力 / 我的）。
     结构类 .web-shell / .web-top / .web-content / .wview / .web-nav 全部保留 ——
     experience-core.js 与 experience-consumer.js 靠 .web-nav、.web-content、#publicActivities、
     #publicProducts 定位，换掉它们等于让这两个装饰层静默失效。
     视觉全部在 /static/web/web.css（C 端专属），四端共用的 shared.css / clubos-ux.css 一个字节没动。 -->
<div class="web-shell is-home">

  <header class="web-top">
    <button class="web-top__btn" type="button" onclick="wv('wactivities')" aria-label="搜索活动"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg></button>
    <strong>远拓户外</strong>
    <button class="web-top__btn" type="button" onclick="wv('wme')" aria-label="我的"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></svg></button>
  </header>

  <div class="web-content">

    <!-- ── 首页：满屏 hero（一屏一张大图）+ 全部活动瀑布流 ──────────────────
         .w-hero--full 的高度由 CSS 给（100svh 减底部导航），这里不再写像素；
         骨架屏跟着撑满同一高度，免得加载完照片时页面"跳一下"。
         #homeFeed 由 web-biz.js 的 loadHome() 填充：全部活动按最新上架倒序的瀑布流，
         没有封面时走兜底渐变卡。#homeFeatured/#homeGear 已删 —— 旧 web.js 的
         loadHome 对它们都有 null 守卫，删节点不会报错。 -->
    <section id="whome" class="wview">
      <div class="w-hero w-hero--full" id="homeHero"><div class="w-sk" style="padding:0;height:100%"><div class="w-sk__bar" style="height:100%;border-radius:0"></div></div></div>
      <div class="w-pad w-waterfall" id="homeFeed"></div>
    </section>

    <!-- ── 活动：顶部主题卡 peek 轮播 + 全部活动瀑布流 ──────────────────────
         主题卡 = 中间一张竖版大卡、左右各露出相邻卡片的边（.w-theme__*）；
         文字介绍、搜索框、时间胶囊（全部/本月/下月）全部删除 —— 顾客要的是
         「左右翻主题、往下看活动」，不是先读一段介绍再筛一遍。
         #publicActivities 保留：experience-core.js 靠它定位，删掉 = 装饰层静默失效。 -->
    <section id="wactivities" class="wview" style="display:none">
      <div id="activityList">
        <div class="w-carousel" id="actFeatured"></div>
        <div class="w-waterfall" id="publicActivities"></div>
        <div id="activityEmpty"></div>
      </div>
      <div id="publicDetail"></div>
    </section>

    <!-- ── 装备：左侧分类 + 右侧双列网格 ───────────────────────────────
         #publicProducts 带 .w-grid：experience-consumer.js 是按 `#publicProducts .web-card`
         数商品张数的，卡片类名必须保留 .web-card（额外挂 .w-product 做外观重置）。 -->
    <section id="wmall" class="wview" style="display:none">
      <div class="w-shop">
        <aside class="w-shop__side" id="mallCats"></aside>
        <div class="w-shop__main">
          <!-- 装备搜索框：web.js 的 renderMall() 一直在读 #gearSearch 做过滤，
               之前 HTML 里没有这个节点，搜索是死代码（页面上根本没有输入框）。 -->
          <label class="w-field w-field--shop"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg><input id="gearSearch" type="search" placeholder="搜索装备名称或分类" aria-label="搜索装备"></label>
          <div class="w-shop__tabs" id="mallTabs"></div>
          <div class="w-grid" id="publicProducts"></div>
          <!-- id 由 renderMall() 按筛选结果改写：「共 N 件在售」/「筛选出 N 件」 -->
          <div class="w-shop__note" id="mallNote">平台统一商品、库存、发货与售后；会员等级折扣在结算时自动生效。</div>
        </div>
      </div>
      <!-- 装备详情页：与活动详情页同一个套路 —— 列表区留在 DOM 里靠 display 切换，
           返回时不用重新拉数据。它不能放进 #publicProducts，否则会被
           experience-consumer.js 当成又一件商品数进去。 -->
      <div id="productDetail"></div>
    </section>

    <!-- ── 业务介绍：俱乐部老板可自定义的板块（后台开关 + 自定义内容）──────
         数据来自 clubs.biz_section_json（后台 PATCH 开关 + 内容）。
         关闭或没配内容时整块不渲染 —— 空壳板块比没有板块更伤信任。
         旧「户外能力」的履历/技能/装备块全部移除：那是伪造的能力值，
         后端没有 skill 表，前端不得编造能力。 -->
    <section id="wability" class="wview" style="display:none">
      <div class="w-biz" id="bizIntro"></div>
    </section>

    <!-- ── 我的：深色照片底 + 毛玻璃会员卡，下滑接订单与福利 ──────────────
         #clubPts / #gearPts / #memberLevel / #memberTierPerks 必须保留原 id：
         loadMemberCenter() 与 loadWallet() 是直接按 id 写这两个积分与等级文案的。
         #worders 与 #wmember 同样保留（loadOrders / loadMemberCenter 的写入目标），
         顺序按上轮确认的「订单在前、会员福利在后」。 -->
    <section id="wme" class="wview" style="display:none">
      <div class="w-me__stage">
        <div class="w-me__bg" id="meBg"></div>
        <div class="w-me__bgtint"></div>
        <div class="w-me__card">
          <div class="w-me__id">
            <div class="w-me__avatar" id="meAvatar">远</div>
          <div class="w-me__who">
            <div class="w-me__name"><span id="meName">户外会员</span><span class="w-me__tier" id="meTier">普通会员</span></div>
            <div class="w-me__sub w-me__legacy" id="memberLevel">正在读取会员信息…</div>
            <button class="w-me__center" type="button" onclick="openMemberCard()">会员中心<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>
          </div>
            <!-- 图标是「卡」不是二维码：点开是真实的会员信息，没有可被扫码核销的签名码，
                 竖一个扫不动的码比不放更伤信任。 -->
            <button class="w-me__qr" type="button" onclick="openMemberCard()" aria-label="查看会员信息"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="5" width="18.4" height="14" rx="2.6"/><path d="M2.8 9.6h18.4"/><path d="M6.4 14.6h4"/></svg></button>
          </div>
          <div class="w-me__up">
            <div class="w-me__uphead"><span>升级条件</span><span id="meUpTip">—</span></div>
            <div class="w-me__bar"><i id="meUpBar" style="width:0%"></i></div>
            <div class="w-me__legacy" id="memberTierPerks" style="margin-top:9px"></div>
          </div>
          <!-- 积分三格（对齐会员中心 JPG）：活动积分 / 装备积分 / 可用券。
               #clubPts/#gearPts 保留原 id —— loadWallet() 按 id 写这两个数；
               #couponCnt 由 web-biz.js 从福利接口带出，没有券时显示 0，不造假数据。 -->
          <div class="w-me__pts">
            <div><b id="clubPts">—</b><span>活动积分</span></div>
            <div><b id="gearPts">—</b><span>装备积分</span></div>
            <div><b id="couponCnt">0</b><span>可用券</span></div>
          </div>
          <div class="w-me__grid" id="meGrid"></div>
          <div class="w-me__svc">
            <div class="w-me__svctitle">我的服务</div>
            <div class="w-me__grid" id="meService"></div>
          </div>
          <button class="w-me__more" type="button" onclick="document.getElementById('memberBenefits')?.scrollIntoView({behavior:'smooth',block:'center'})">查看更多权益</button>
        </div>
      </div>
      <div class="w-me__body">
        <div id="worders">
          <div class="w-sec__head"><div><h2>我的订单</h2><p>活动报名与装备订单都在这里，退款与售后分开处理</p></div></div>
          <div class="web-card"><h3>活动订单</h3><div id="activityOrders"></div></div>
          <div class="web-card"><h3>待支付</h3><div id="pendingOrders"></div></div>
          <div class="web-card"><h3>装备订单</h3><div id="gearOrders"></div></div>
        </div>
        <div id="wmember">
          <div class="web-card"><h3>可兑换福利</h3><div id="memberBenefits"></div></div>
          <div class="web-card"><h3>我的兑换</h3><div id="memberRedemptions"></div></div>
        </div>
      </div>
    </section>

  </div>

  <!-- 底部导航 5 格：首页 / 活动 / 装备 / 户外能力 / 我的。
       图标做成内联 SVG —— 旧版是 clubos-ux.css 里 :nth-child(n):before 的字符图标，
       只有 4 个，加到第 5 格会没有图标可用；字符字形在不同系统上也不可控。 -->
  <nav class="web-nav" aria-label="主要导航">
    <button class="active" data-wv="whome" onclick="wv('whome',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.4 9.4V20h13.2V9.4"/><path d="M9.6 20v-5.6h4.8V20"/></svg><span>首页</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wactivities" onclick="wv('wactivities',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5 9.5 7l4 6.6 2.4-3.9 5.6 9.8z"/></svg><span>活动</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wmall" onclick="wv('wmall',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M8.6 8V6.4a3.4 3.4 0 0 1 6.8 0V8"/></svg><span>装备</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wability" onclick="wv('wability',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4 10.8 10.8 8.4 15.6l4.8-2.4z"/></svg><span>户外能力</span><i class="w-navdot" aria-hidden="true"></i></button>
    <button data-wv="wme" onclick="wv('wme',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></svg><span>我的</span><i class="w-navdot" aria-hidden="true"></i></button>
  </nav>
</div>

<script src="/static/shared.js?v=20261010a"></script>
<script src="/static/web/web.js?v=20261010a"></script>
<script src="/static/web/web-biz.js?v=20261010a"></script>
<script src="/static/ux/clubos-ux.js?v=20261010a"></script>
<script src="/static/ux/workflows-web.js?v=20261010a"></script>
<script src="/static/ux/qr-local.js?v=20261010a"></script>
<script src="/static/ux/experience-core.js?v=20261010a"></script>
<script src="/static/ux/payment-experience.js?v=20261010a"></script>
<script src="/static/ux/experience-consumer.js?v=20261010a"></script>
</body></html>
