name: ClubOS v0.23 Regression
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'schema.sql'
      - 'static/**'
      - 'tests/**'
      - 'scripts/regression_v023.sh'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: ./scripts/regression_v023.sh
