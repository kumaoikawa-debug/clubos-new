name: ClubOS v0.25 Security and Regression
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'schema.sql'
      - 'static/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/v025-security.yml'
  pull_request:
jobs:
  regression-and-negative-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile and frontend syntax
        run: |
          python -m compileall -q app.py db.py security_v025.py clubos_domain tests scripts
          for file in static/{web,club,leader,platform}/*.js static/shared.js; do node --check "$file"; done
      - name: Historical regression and production-mode negative security tests
        run: ./scripts/regression_v025.sh
