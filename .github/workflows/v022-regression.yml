name: ClubOS v0.22 Commerce Analytics Replenishment Regression
on:
  workflow_dispatch:
  push:
    paths: ['app.py','db.py','schema.sql','clubos_domain/**','tests/**','static/**','scripts/regression_v022.sh','.github/workflows/v022-regression.yml']
  pull_request:
    paths: ['app.py','db.py','schema.sql','clubos_domain/**','tests/**','static/**','scripts/regression_v022.sh','.github/workflows/v022-regression.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ./scripts/regression_v022.sh
