name: ClubOS v0.18 Regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'db.py'
      - 'schema.sql'
      - 'clubos_domain/**'
      - 'tests/**'
      - 'static/**'
      - '.github/workflows/v018-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: MOCK_AI=1 COMMERCE_PROVIDER=local ./scripts/regression_v018.sh
