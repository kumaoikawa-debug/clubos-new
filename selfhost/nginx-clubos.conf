# 裸机方案：nginx 反向代理（配合 clubos.service）
# 放到 /etc/nginx/sites-available/clubos 并软链到 sites-enabled，然后：
#   sudo certbot --nginx -d 你的域名    （自动签发并配置 HTTPS）
# 注意：CLUBOS_SECURITY_MODE=production 下 Cookie 为 Secure，
#       所以必须用 https（certbot 会把下面这整段自动加上 ssl 配置）。
server {
    listen 80;
    server_name 你的域名;   # 例如 topoutdoor.cn

    # Let's Encrypt 校验用，certbot 会自动处理
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # 静态资源可直接由 nginx 服务，减轻后端压力（可选）
    location /static/ {
        alias /opt/clubos-new/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
