# ClubOS NEW 自托管（Docker 一键方案）
# 包含：应用容器 + Caddy 反向代理（自动申请/续期 Let's Encrypt 证书，零配置 HTTPS）
#
# 用法：
#   1. 复制 .env.example 为 .env，填入 CLUBOS_PLATFORM_ADMIN_PASS 与 DOMAIN
#   2. 确认域名 DNS A 记录已指向本机公网 IP，且 80/443 端口可通行
#   3. docker compose up -d
#   4. 访问 https://你的域名/  （http 会自动跳转 https）
#
# Caddy 会自动完成 HTTPS，无需手动申请证书。
services:
  clubos:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    env_file: .env
    environment:
      - CLUBOS_DB_PATH=/data/clubos.db
    volumes:
      - clubos_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 将 .env 中的 DOMAIN 传给 Caddy（Caddy 用 {$DOMAIN} 占位）
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    depends_on:
      - clubos
    restart: unless-stopped

volumes:
  clubos_data:
  caddy_data:
  caddy_config:
